<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 720" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">amped data model</title>
  <desc id="desc">Entity-relationship diagram showing the persistent data objects: User, Vehicle, Charger, Retail plan, Charge session, Interval, Price forecast, Region.</desc>

  <defs>
    <style>
      .tbl-header { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .field { font-size: 12px; fill: #2C2C2A; font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .field-meta { font-size: 11px; fill: #888780; font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .rel { stroke: #5F5E5A; stroke-width: 1; fill: none; }
      .rel-label { font-size: 11px; fill: #5F5E5A; font-style: italic; }
      .card { font-size: 12px; fill: #2C2C2A; font-family: 'SF Mono', Consolas, Monaco, monospace; }
    </style>
  </defs>

  <text x="20" y="24" font-size="14" font-weight="500" fill="#2C2C2A">amped — Data model (entity-relationship diagram)</text>

  <!-- ─────────── USER ─────────── -->
  <g>
    <rect x="350" y="50" width="200" height="148" rx="8" fill="#FFFFFF" stroke="#3C3489" stroke-width="1"/>
    <rect x="350" y="50" width="200" height="28"  rx="8" fill="#534AB7"/>
    <rect x="350" y="65" width="200" height="13"  fill="#534AB7"/>
    <text x="450" y="70" text-anchor="middle" class="tbl-header">USER</text>
    <line x1="350" y1="78" x2="550" y2="78" stroke="#3C3489" stroke-width="0.5"/>
    <text x="362" y="98"  class="field">id</text>          <text x="538" y="98"  text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="362" y="118" class="field">email</text>       <text x="538" y="118" text-anchor="end" class="field-meta">string</text>
    <text x="362" y="138" class="field">region_code</text> <text x="538" y="138" text-anchor="end" class="field-meta">FK</text>
    <text x="362" y="158" class="field">created_at</text>  <text x="538" y="158" text-anchor="end" class="field-meta">timestamp</text>
    <text x="362" y="178" class="field">tesla_token</text> <text x="538" y="178" text-anchor="end" class="field-meta">encrypted</text>
  </g>

  <!-- ─────────── REGION ─────────── -->
  <g>
    <rect x="80" y="50" width="180" height="88" rx="8" fill="#FFFFFF" stroke="#3C3489" stroke-width="1"/>
    <rect x="80" y="50" width="180" height="28" rx="8" fill="#534AB7"/>
    <rect x="80" y="65" width="180" height="13" fill="#534AB7"/>
    <text x="170" y="70" text-anchor="middle" class="tbl-header">REGION</text>
    <line x1="80" y1="78" x2="260" y2="78" stroke="#3C3489" stroke-width="0.5"/>
    <text x="92" y="98"  class="field">code</text> <text x="248" y="98"  text-anchor="end" class="field-meta">string · PK</text>
    <text x="92" y="118" class="field">name</text> <text x="248" y="118" text-anchor="end" class="field-meta">string</text>
  </g>

  <!-- ─────────── RETAIL_PLAN ─────────── -->
  <g>
    <rect x="640" y="50" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#3C3489" stroke-width="1"/>
    <rect x="640" y="50" width="200" height="28" rx="8" fill="#534AB7"/>
    <rect x="640" y="65" width="200" height="13" fill="#534AB7"/>
    <text x="740" y="70" text-anchor="middle" class="tbl-header">RETAIL_PLAN</text>
    <line x1="640" y1="78" x2="840" y2="78" stroke="#3C3489" stroke-width="0.5"/>
    <text x="652" y="98"  class="field">id</text>          <text x="828" y="98"  text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="652" y="118" class="field">user_id</text>     <text x="828" y="118" text-anchor="end" class="field-meta">FK</text>
    <text x="652" y="138" class="field">retailer</text>    <text x="828" y="138" text-anchor="end" class="field-meta">string</text>
    <text x="652" y="158" class="field">plan_type</text>   <text x="828" y="158" text-anchor="end" class="field-meta">enum</text>
  </g>

  <!-- ─────────── VEHICLE ─────────── -->
  <g>
    <rect x="80" y="260" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#085041" stroke-width="1"/>
    <rect x="80" y="260" width="200" height="28" rx="8" fill="#0F6E56"/>
    <rect x="80" y="275" width="200" height="13" fill="#0F6E56"/>
    <text x="180" y="280" text-anchor="middle" class="tbl-header">VEHICLE</text>
    <line x1="80" y1="288" x2="280" y2="288" stroke="#085041" stroke-width="0.5"/>
    <text x="92" y="308" class="field">id</text>           <text x="268" y="308" text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="92" y="328" class="field">user_id</text>      <text x="268" y="328" text-anchor="end" class="field-meta">FK</text>
    <text x="92" y="348" class="field">make_model</text>   <text x="268" y="348" text-anchor="end" class="field-meta">string</text>
    <text x="92" y="368" class="field">battery_kwh</text>  <text x="268" y="368" text-anchor="end" class="field-meta">float</text>
  </g>

  <!-- ─────────── CHARGER ─────────── -->
  <g>
    <rect x="640" y="260" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#085041" stroke-width="1"/>
    <rect x="640" y="260" width="200" height="28" rx="8" fill="#0F6E56"/>
    <rect x="640" y="275" width="200" height="13" fill="#0F6E56"/>
    <text x="740" y="280" text-anchor="middle" class="tbl-header">CHARGER</text>
    <line x1="640" y1="288" x2="840" y2="288" stroke="#085041" stroke-width="0.5"/>
    <text x="652" y="308" class="field">id</text>               <text x="828" y="308" text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="652" y="328" class="field">user_id</text>          <text x="828" y="328" text-anchor="end" class="field-meta">FK</text>
    <text x="652" y="348" class="field">max_kw</text>           <text x="828" y="348" text-anchor="end" class="field-meta">float</text>
    <text x="652" y="368" class="field">integration_type</text> <text x="828" y="368" text-anchor="end" class="field-meta">enum</text>
  </g>

  <!-- ─────────── CHARGE_SESSION ─────────── -->
  <g>
    <rect x="330" y="260" width="240" height="168" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
    <rect x="330" y="260" width="240" height="28" rx="8" fill="#993C1D"/>
    <rect x="330" y="275" width="240" height="13" fill="#993C1D"/>
    <text x="450" y="280" text-anchor="middle" class="tbl-header">CHARGE_SESSION</text>
    <line x1="330" y1="288" x2="570" y2="288" stroke="#993C1D" stroke-width="0.5"/>
    <text x="342" y="308" class="field">id</text>             <text x="558" y="308" text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="342" y="328" class="field">user_id</text>        <text x="558" y="328" text-anchor="end" class="field-meta">FK</text>
    <text x="342" y="348" class="field">plug_in</text>        <text x="558" y="348" text-anchor="end" class="field-meta">timestamp</text>
    <text x="342" y="368" class="field">departure</text>      <text x="558" y="368" text-anchor="end" class="field-meta">timestamp</text>
    <text x="342" y="388" class="field">target_soc</text>     <text x="558" y="388" text-anchor="end" class="field-meta">int</text>
    <text x="342" y="408" class="field">baseline_cost</text>  <text x="558" y="408" text-anchor="end" class="field-meta">float</text>
    <text x="342" y="428" class="field">actual_cost</text>    <text x="558" y="428" text-anchor="end" class="field-meta">float</text>
  </g>

  <!-- ─────────── INTERVAL ─────────── -->
  <g>
    <rect x="330" y="490" width="240" height="148" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
    <rect x="330" y="490" width="240" height="28" rx="8" fill="#993C1D"/>
    <rect x="330" y="505" width="240" height="13" fill="#993C1D"/>
    <text x="450" y="510" text-anchor="middle" class="tbl-header">INTERVAL</text>
    <line x1="330" y1="518" x2="570" y2="518" stroke="#993C1D" stroke-width="0.5"/>
    <text x="342" y="538" class="field">id</text>               <text x="558" y="538" text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="342" y="558" class="field">session_id</text>       <text x="558" y="558" text-anchor="end" class="field-meta">FK</text>
    <text x="342" y="578" class="field">start_time</text>       <text x="558" y="578" text-anchor="end" class="field-meta">timestamp</text>
    <text x="342" y="598" class="field">charging</text>         <text x="558" y="598" text-anchor="end" class="field-meta">bool</text>
    <text x="342" y="618" class="field">price_c_per_kwh</text>  <text x="558" y="618" text-anchor="end" class="field-meta">float</text>
  </g>

  <!-- ─────────── PRICE_FORECAST ─────────── -->
  <g>
    <rect x="640" y="490" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
    <rect x="640" y="490" width="200" height="28" rx="8" fill="#534AB7"/>
    <rect x="640" y="505" width="200" height="13" fill="#534AB7"/>
    <text x="740" y="510" text-anchor="middle" class="tbl-header">PRICE_FORECAST</text>
    <line x1="640" y1="518" x2="840" y2="518" stroke="#534AB7" stroke-width="0.5"/>
    <text x="652" y="538" class="field">id</text>            <text x="828" y="538" text-anchor="end" class="field-meta">uuid · PK</text>
    <text x="652" y="558" class="field">region_code</text>   <text x="828" y="558" text-anchor="end" class="field-meta">FK</text>
    <text x="652" y="578" class="field">published_at</text>  <text x="828" y="578" text-anchor="end" class="field-meta">timestamp</text>
    <text x="652" y="598" class="field">prices</text>        <text x="828" y="598" text-anchor="end" class="field-meta">json</text>
  </g>

  <!-- ─────────── Relationships ─────────── -->
  <!-- REGION ─o{ USER -->
  <path d="M260 94 L350 94" class="rel"/>
  <text x="285" y="86" class="card">||</text>
  <text x="332" y="86" class="card">o{</text>
  <text x="305" y="108" class="rel-label">located in</text>

  <!-- USER ─|| RETAIL_PLAN -->
  <path d="M550 94 L640 94" class="rel"/>
  <text x="572" y="86" class="card">||</text>
  <text x="622" y="86" class="card">||</text>
  <text x="595" y="108" class="rel-label">has plan</text>

  <!-- USER ─o{ VEHICLE -->
  <path d="M400 198 L400 240 L180 240 L180 260" class="rel"/>
  <text x="395" y="216" class="card">||</text>
  <text x="172" y="258" class="card">o{</text>
  <text x="195" y="234" class="rel-label">owns</text>

  <!-- USER ─o{ CHARGER -->
  <path d="M500 198 L500 240 L740 240 L740 260" class="rel"/>
  <text x="495" y="216" class="card">||</text>
  <text x="732" y="258" class="card">o{</text>
  <text x="700" y="234" class="rel-label">owns</text>

  <!-- USER ─o{ CHARGE_SESSION -->
  <path d="M450 198 L450 260" class="rel"/>
  <text x="455" y="216" class="card">||</text>
  <text x="455" y="252" class="card">o{</text>
  <text x="460" y="234" class="rel-label">has</text>

  <!-- VEHICLE ─o{ CHARGE_SESSION -->
  <path d="M280 330 L330 330" class="rel"/>
  <text x="284" y="322" class="card">||</text>
  <text x="316" y="322" class="card">o{</text>

  <!-- CHARGER ─o{ CHARGE_SESSION -->
  <path d="M640 330 L570 330" class="rel"/>
  <text x="624" y="322" class="card">o{</text>
  <text x="576" y="322" class="card">||</text>

  <!-- CHARGE_SESSION ─|{ INTERVAL -->
  <path d="M450 428 L450 490" class="rel"/>
  <text x="455" y="446" class="card">||</text>
  <text x="455" y="484" class="card">|{</text>
  <text x="460" y="464" class="rel-label">composed of</text>

  <!-- PRICE_FORECAST ─o{ INTERVAL -->
  <path d="M640 560 L570 560" class="rel"/>
  <text x="624" y="552" class="card">||</text>
  <text x="576" y="552" class="card">o{</text>
  <text x="588" y="552" class="rel-label">prices</text>

  <!-- REGION ─o{ PRICE_FORECAST (long path around) -->
  <path d="M170 138 L170 470 L740 470 L740 490" class="rel" stroke-dasharray="3 3"/>
  <text x="165" y="156" class="card">||</text>
  <text x="732" y="486" class="card">o{</text>
  <text x="180" y="465" class="rel-label">publishes forecasts for</text>

  <!-- Legend -->
  <text x="20" y="700" class="rel-label">Cardinality: ||=one, o{=zero-or-many, |{=one-or-many. Dashed line = traverses the diagram.</text>
</svg>
