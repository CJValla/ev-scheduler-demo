<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 560" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">amped frontend component tree</title>
  <desc id="desc">Structural view of React components: root, layout regions, leaf components, and pure logic modules.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; }
      .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
      .legend-text { font-size: 12px; fill: #444441; }
    </style>
  </defs>

  <text x="40" y="28" font-size="14" font-weight="500" fill="#2C2C2A">amped — Frontend component tree</text>

  <!-- Root -->
  <g>
    <rect x="240" y="60" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="84"  text-anchor="middle" class="t"  fill="#712B13">EVScheduler</text>
    <text x="340" y="102" text-anchor="middle" class="ts" fill="#993C1D">Root, owns all state</text>
  </g>

  <!-- Layout regions -->
  <g>
    <rect x="40"  y="180" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="120" y="204" text-anchor="middle" class="t"  fill="#0C447C">Sidebar</text>
    <text x="120" y="222" text-anchor="middle" class="ts" fill="#185FA5">Inputs + plan</text>
  </g>

  <g>
    <rect x="240" y="180" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="204" text-anchor="middle" class="t"  fill="#0C447C">ForecastChart</text>
    <text x="340" y="222" text-anchor="middle" class="ts" fill="#185FA5">Hero visualisation</text>
  </g>

  <g>
    <rect x="480" y="180" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="560" y="204" text-anchor="middle" class="t"  fill="#0C447C">CostEquation</text>
    <text x="560" y="222" text-anchor="middle" class="ts" fill="#185FA5">Inline summary</text>
  </g>

  <g>
    <rect x="240" y="260" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="284" text-anchor="middle" class="t"  fill="#0C447C">ForecastTable</text>
    <text x="340" y="302" text-anchor="middle" class="ts" fill="#185FA5">48 rows + overrides</text>
  </g>

  <!-- Leaf components -->
  <g>
    <rect x="40"  y="340" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="120" y="364" text-anchor="middle" class="t"  fill="#085041">SliderField</text>
    <text x="120" y="382" text-anchor="middle" class="ts" fill="#0F6E56">SoC, time, kW</text>
  </g>

  <g>
    <rect x="240" y="340" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="364" text-anchor="middle" class="t"  fill="#085041">IntervalRow</text>
    <text x="340" y="382" text-anchor="middle" class="ts" fill="#0F6E56">Click to override</text>
  </g>

  <g>
    <rect x="480" y="340" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="560" y="364" text-anchor="middle" class="t"  fill="#085041">PlanSummary</text>
    <text x="560" y="382" text-anchor="middle" class="ts" fill="#0F6E56">28% → 80%</text>
  </g>

  <!-- Pure functions section -->
  <text x="340" y="442" text-anchor="middle" class="ts" fill="#5F5E5A">Pure functions (no state, server-portable)</text>

  <g>
    <rect x="100" y="460" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="200" y="484" text-anchor="middle" class="t"  fill="#3C3489">scheduleCharging</text>
    <text x="200" y="502" text-anchor="middle" class="ts" fill="#534AB7">Picks cheapest N</text>
  </g>

  <g>
    <rect x="380" y="460" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="480" y="484" text-anchor="middle" class="t"  fill="#3C3489">calcCost</text>
    <text x="480" y="502" text-anchor="middle" class="ts" fill="#534AB7">Sums interval costs</text>
  </g>

  <!-- Arrows: root → regions -->
  <path d="M300 116 L300 150 L120 150 L120 180" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="116" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>
  <path d="M380 116 L380 150 L560 150 L560 180" class="arr" marker-end="url(#arrow)"/>

  <!-- ForecastChart → ForecastTable -->
  <line x1="340" y1="236" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>

  <!-- Regions → leaf components -->
  <line x1="120" y1="236" x2="120" y2="340" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="316" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>
  <line x1="560" y1="236" x2="560" y2="340" class="arr" marker-end="url(#arrow)"/>

  <!-- Root → pure functions (dashed = uses, not contains) -->
  <path d="M280 116 L280 430 L200 430 L200 460" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M400 116 L400 430 L480 430 L480 460" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40"  y="535" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="56"  y="544" class="legend-text">Root</text>
  <rect x="110" y="535" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="126" y="544" class="legend-text">Layout region</text>
  <rect x="240" y="535" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="256" y="544" class="legend-text">Leaf component</text>
  <rect x="380" y="535" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="396" y="544" class="legend-text">Pure logic</text>
  <text x="510" y="544" class="legend-text">--- = uses (not owns)</text>
</svg>
